<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variabili JavaScript</title>
</head>

<body>

    <h1>Esercizio JavaScript</h1>

    <script>

        // Dichiaro la variabile num1 e le assegno un numero
        let num1 = 10;

        // Dichiaro la variabile num2 e le assegno un numero
        let num2 = 25;

        // Visualizzo il valore di num1
        document.write("Il valore della variabile num1 e' " + num1 + "<br>");

        // Visualizzo il valore di num2
        document.write("Il valore della variabile num2 e' " + num2 + "<br>");

        // Dichiaro la variabile stringa
        let stringa = "Ciao mondo";

        // Visualizzo il valore della variabile stringa
        document.write("Il valore della variabile stringa e' " + stringa + "<br>");

        // Cambio il valore della variabile stringa
        stringa = "Sto imparando JavaScript";

        // Visualizzo il nuovo valore della stringa
        document.write("Il nuovo valore della variabile stringa e' " + stringa + "<br>");

        // Dichiaro la costante PIGRECO
        const PIGRECO = 3.14159265359;

        // Visualizzo il valore di PIGRECO
        document.write("Il valore di PIGRECO e' " + PIGRECO + "<br>");

        // Provo a cambiare il valore della costante
        PIGRECO = 3.14;

    </script>

</body>
</html>
